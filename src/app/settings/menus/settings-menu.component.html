<div class="icon-form-field mmn-field-row">
  <mat-icon>{{ icons[index] }}</mat-icon>
  <div class="mmn-field">
    <label class="mmn-field-label" [for]="'menu-label-' + index">{{ defaultLabels[index] | translate }}</label>
    <mat-form-field subscriptSizing="dynamic">
      <input [id]="'menu-label-' + index" [(ngModel)]="label" (ngModelChange)="labelChange($event)" matInput type="text" />
    </mat-form-field>
  </div>
  <button (click)="deleteLabel()" mat-icon-button color="primary">
    <mat-icon>delete</mat-icon>
  </button>
</div>
