<div class="container">
  <div fxFlex="99%">
    <div class="button-row" fxLayout="row" fxLayoutAlign="start center" [ngClass]="routeAnimationsElements">
      <button mat-flat-button color="primary" (click)="save()">
        <mat-icon>save</mat-icon>
        {{ 'mmn.track.button.saveAs' | translate }}
      </button>

      <button mat-flat-button color="primary" (click)="effacerEnregistrements()">
        <mat-icon>delete_outline</mat-icon>
        {{ 'mmn.track.button.delete' | translate }}
      </button>
    </div>
    <div class="button-row" fxLayout="row" fxLayoutAlign="start center">
      <mat-slide-toggle id="guide-track-toggle" fxFlex="50%" [checked]="trackPlayActivated" [(ngModel)]="trackPlayActivated" (change)="toggleTrackPlay($event)">{{ 'mmn.track.button.play' | translate }}</mat-slide-toggle>

      <div fxFlex="49%" class="mmn-field">
        <label class="mmn-field-label" id="track-data-display-type-label">
          {{ 'mmn.track.data.display.type' | translate }}
          <mat-icon class="track-help-icon" [matTooltip]="'mmn.track.data.display.type.help' | translate">help_outline</mat-icon>
        </label>
        <mat-radio-group [(ngModel)]="trackDataDisplayType" aria-labelledby="track-data-display-type-label">
          <mat-radio-button value="querystring" [matTooltip]="'mmn.track.data.display.type.querystring.tooltip' | translate">Query string</mat-radio-button>
          <mat-radio-button class="plm" value="body" [matTooltip]="'mmn.track.data.display.type.body.tooltip' | translate">Body</mat-radio-button>
        </mat-radio-group>
      </div>
    </div>
    <div class="track-fields" fxLayout="row" fxLayoutAlign="start end">
      <div id="guide-track-input" fxFlex="50%" class="mmn-field track-width">
        <label class="mmn-field-label" for="track-input">{{ 'mmn.track.input' | translate }}</label>
        <mat-form-field subscriptSizing="dynamic">
          <input id="track-input" [(ngModel)]="trackData" (focusout)="focusOut()" matInput placeholder="Ex. jquery" />
        </mat-form-field>
      </div>

      <div fxFlex="49%" class="mmn-field track-width">
        <label class="mmn-field-label" for="track-data-display">{{ 'mmn.track.input.data.display' | translate }}</label>
        <mat-form-field subscriptSizing="dynamic">
          <input id="track-data-display" [(ngModel)]="trackDataDisplay" matInput placeholder="Ex. name or name, name1" />
        </mat-form-field>
      </div>
    </div>
    @if (tracks) {
      <mat-list id="guide-track-results" [mmnSelectTrack]="selectedTrackId">
        @for (track of tracks; track track.id; let i = $index) {
          <mat-list-item [class.selected]="isSelected(track)">
            <mmn-track-detail [id]="'list-' + track.id" [index]="i" [track]="track" [dataDisplay]="_trackDataDisplay" [dataDisplayType]="_trackDataDisplayType" class="animated lightSpeedIn"></mmn-track-detail>
          </mat-list-item>
        }
      </mat-list>
    }
  </div>
</div>
